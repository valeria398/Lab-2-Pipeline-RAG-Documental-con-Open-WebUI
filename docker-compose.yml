services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-rag-lab
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=2
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-lab
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama-rag-lab:11434
      - WEBUI_AUTH=true
    volumes:
      - open-webui_data:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
  open-webui_data: